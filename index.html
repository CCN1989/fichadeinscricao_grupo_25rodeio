<!DOCTYPE html>
<html>
<body>
    <h2>Teste de Conexão CTG Chama Nativa</h2>
    <button onclick="testar()">Enviar Linha de Teste</button>
    <p id="status"></p>

    <script>
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbw4JGkHdfaRPHGha3fWS39udzCIi5nmp1tcIROS9Dh28aUEes2Ej4Sb8rxNANEuqZ84/exec";

        async function testar() {
            const status = document.getElementById("status");
            status.innerText = "Enviando...";

            // Criamos um pacote de dados mínimo que seu script .gs entenda
            const pacoteTeste = {
                entidade: "ENTIDADE TESTE",
                municipio: "CIDADE TESTE",
                rt: "1ª RT",
                email: "teste@teste.com",
                patrao: "PATRAO TESTE",
                whats: "5199999999",
                responsavel: "RESPONSAVEL TESTE",
                pix: "CHAVE TESTE",
                categorias: [{
                    nome: "Adulta",
                    danca1: "Danca 1", danca2: "Danca 2", danca3: "Danca 3",
                    musical: "Não",
                    integrantes: [{ nome: "INTEGRANTE TESTE", nascimento: "2000-01-01", cartao: "12345" }]
                }],
                arquivo: null // Sem arquivo para não pesar o teste
            };

            const params = new URLSearchParams();
            params.append("dados", JSON.stringify(pacoteTeste));

            try {
                // Usamos no-cors para evitar erros de bloqueio de resposta do navegador
                await fetch(URL_SCRIPT, {
                    method: "POST",
                    mode: "no-cors",
                    body: params,
                    headers: { "Content-Type": "application/x-www-form-urlencoded" }
                });

                status.innerText = "Comando enviado! Verifique a planilha 'GRUPOS' agora.";
                status.style.color = "green";
            } catch (e) {
                status.innerText = "Erro no envio: " + e.message;
                status.style.color = "red";
            }
        }
    </script>
</body>
</html>
