<!DOCTYPE html>
  <style>
    body {
  font-family: Arial, sans-serif;
  background: #fff7f0;
  margin: 0;
  padding: 0;
}

    header {
  width: 100vw;       /* largura total da tela */
  margin: 0;
  padding: 0;
  overflow: hidden;
}

    header img {
      width: 85px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: auto;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0px 0px 12px rgba(0,0,0,0.2);
    }

    .section-title {
      background: #ff7a00;
      color: white;
      padding: 12px;
      border-radius: 10px;
      margin-top: 40px;
      font-size: 18px;
    }

    .category-box {
      border: 2px solid #ffd2a8;
      padding: 15px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .btn-voltar {
  background: #cc5f00;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
}

    .category-box h3 {
      margin: 0;
      color: #cc5f00;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      font-size: 14px;
      text-align: center;
    }

    th {
      background: #ffe0c2;
    }

    input {
      width: 95%;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    /* 🎨 CORES */
    .input-prenda {
      background: #ffe6ef;
      border: 1px solid #ff99bb;
    }

    .input-peao {
      background: #e6f0ff;
      border: 1px solid #77aaff;
    }

    .input-danca {
      background: #fff6db;
      border: 1px solid #ffcc66;
      font-weight: bold;
    }

    .btn-add {
      margin-top: 10px;
      background: #ff7a00;
      border: none;
      padding: 7px 14px;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-remove {
      background: red;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* SUPLENTE */
    .suplente {
      background: #fff3cd !important;
      border: 2px solid #ff9900;
    }

    .tag-suplente {
      color: red;
      font-size: 13px;
      font-weight: bold;
    }

    .btn-submit {
      margin-top: 50px;
      width: 100%;
      padding: 14px;
      background: #ff7a00;
      color: white;
      border: none;
      font-size: 18px;
      border-radius: 12px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: gray;
    }

    .regulamento-box {
  margin-top: 20px;
  padding: 12px;
  background: #fff3e0;
  border: 2px solid #ff7a00;
  border-radius: 10px;
  font-size: 14px;
}

.regulamento-box a {
  color: #cc5f00;
  font-weight: bold;
  text-decoration: none;
}

.regulamento-box a:hover {
  text-decoration: underline;
}

.regulamento-box input[type="checkbox"] {
  width: auto;
  transform: scale(1.2);
  margin-right: 8px;
}

header {
  padding: 0;
  margin: 0;
  width: 100%;
}

.testeira {
  width: 100vw;        /* ocupa toda a tela */
  max-width: 105%;     
  height: auto;
  display: block;
}

.botoes-final {
  display: flex;
  gap: 15px;
  margin-top: 50px;
}

.botoes-final .btn-submit {
  width: 50%;
  margin-top: 0; /* remove o margin-top antigo */
}

  </style>
</head>

<body>

<header>
  <div class="header-top">
    <!-- ✅ TESTEIRA IMAGEM -->
 <header>
  <img class="testeira"
       src="https://raw.githubusercontent.com/CCN1989/Imagens/refs/heads/main/testeira%20ficha%20GRP.png"
       alt="Testeira Oficial">
</header>

  </div

    <img src="https://github.com/CCN1989/Imagens/blob/main/12RT.png?raw=true">
  </div>
</header>

<main>

  <div class="section-title">Dados da Entidade</div>

  <div class="category-box">
    <table>
      <tr>
        <td>Entidade *</td><td><input required></td>
        <td>Município *</td><td><input required></td>
      </tr>
      <tr>
        <td>RT *</td><td><input required></td>
        <td>Email *</td><td><input required></td>
      </tr>
      <tr>
        <td>Patrão</td><td><input></td>
        <td>WhatsApp *</td><td><input required></td>
      </tr>
      <tr>
        <td>Responsável Inscrição *</td>
        <td colspan="3"><input required></td>
      </tr>
    </table>
  </div>

</div>

<!-- ✅ CHECKBOX REGULAMENTO -->
<div class="regulamento-box">
  <label>
    <input type="checkbox" required>
    Declaro que li e estou de acordo com o
    <a href="REGULAMENTO.pdf" target="_blank">
      Regulamento Oficial do Rodeio
    </a>.
  </label>
</div>

  <!-- Categorias -->
  <div id="categorias"></div>

  <div class="botoes-final">
  <button type="button" class="btn-submit" id="btnEnviar" onclick="enviar()">
    Enviar Inscrição
  </button>

  <a class="btn-submit" 
     style="background:#cc5f00; text-align:center; display:block; "
     href="https://www.ctgchamanativa.com.br">
     Voltar ao site
  </a>
</div>

</main>

<footer>
  Sistema de incrição - CTG Chama Nativa © 2026 - dúvidas secretaria@ctgchamanativa.com.br
</footer>

<script>
  const categorias = ["Pré-Mirim", "Mirim", "Juvenil", "Adulta", "Veterana", "Xirú"];
  const LIMITE = 25;

  function criarCategoria(nome) {

    let box = document.createElement("div");
    box.className = "category-box";

    box.innerHTML = `
      <h3>${nome}</h3>

      <!-- Informações da apresentação -->
      <table>
        <tr>
          <td>Dança Tradicional 1 *</td><td><input required></td>
          <td>Dança Tradicional 2 *</td><td><input required></td>
        </tr>
        <tr>
          <td>Dança Tradicional 3 *</td><td><input required></td>
          <td>Musical *</td>
          <td>
            <select required>
              <option value="">Selecione</option>
              <option>Sim</option>
              <option>Não</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>Comprovante PIX *</td>
          <td colspan="3">
            <input type="file" required>
          </td>
        </tr>
      </table>

      <!-- Integrantes -->
      <table>
        <thead>
          <tr>
            <th>Integrante</th>
            <th>Nascimento</th>
            <th>Cartão</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="${nome}-body"></tbody>
      </table>

      <button class="btn-add" onclick="addIntegrante('${nome}')">
        + Adicionar Integrante (até 25)
      </button>
    `;

    return box;
  }

  function addIntegrante(cat) {

    let tbody = document.getElementById(`${cat}-body`);

    if (tbody.rows.length >= LIMITE) {
      alert("Limite máximo: 25 integrantes por categoria.");
      return;
    }

    let row = document.createElement("tr");

    row.innerHTML = `
      <td><input placeholder="Nome do Integrante"></td>
      <td><input type="date"></td>
      <td><input placeholder="Cartão Tradicionalista"></td>
      <td><button class="btn-remove" onclick="removeRow(this)">X</button></td>
    `;

    tbody.appendChild(row);
  }

  function removeRow(btn) {
    btn.closest("tr").remove();
  }

  // Renderizar categorias
  const container = document.getElementById("categorias");

  categorias.forEach(cat => {
    container.innerHTML += `<div class="section-title">${cat}</div>`;
    container.appendChild(criarCategoria(cat));
    addIntegrante(cat); // linha inicial
  });

  async function enviar() {

  const botao = document.getElementById("btnEnviar");
  botao.disabled = true;
  botao.innerText = "Enviando...";

  const fileInput = document.querySelector('input[type="file"]');
  const file = fileInput.files[0];

  if (!file) {
    alert("Envie o comprovante PIX.");
    botao.disabled = false;
    botao.innerText = "Enviar Inscrição";
    return;
  }

  const reader = new FileReader();

  reader.onload = async function () {

    const base64 = reader.result.split(',')[1];

    let categoriasEnvio = [];

    categorias.forEach(cat => {

      const tbody = document.getElementById(`${cat}-body`);

      if (tbody && tbody.rows.length > 0) {

        let integrantes = [];

        Array.from(tbody.rows).forEach(tr => {
          integrantes.push({
            nome: tr.cells[0].querySelector("input").value,
            nascimento: tr.cells[1].querySelector("input").value,
            cartao: tr.cells[2].querySelector("input").value
          });
        });

        categoriasEnvio.push({
          nome: cat,
          danca1: "...",
          danca2: "...",
          danca3: "...",
          musical: "...",
          integrantes: integrantes
        });
      }

    });

    await fetch("https://script.google.com/macros/s/AKfycbyO6X6cRK_ovLgtFuqN3hBFvfkBCgBu-1eR6O96KWI6hlJsf8PNi66FZi63NlA9ZEk2/exec", {
      method: "POST",
      body: JSON.stringify({
        entidade: document.querySelectorAll("input")[0].value,
        municipio: document.querySelectorAll("input")[1].value,
        rt: document.querySelectorAll("input")[2].value,
        email: document.querySelectorAll("input")[3].value,
        patrao: document.querySelectorAll("input")[4].value,
        whats: document.querySelectorAll("input")[5].value,
        responsavel: document.querySelectorAll("input")[6].value,
        categorias: categoriasEnvio,
        arquivo: {
          nome: file.name,
          tipo: file.type,
          base64: base64
        }
      })
    });

    alert("Inscrição enviada com sucesso!");

    location.reload();
  };

  reader.readAsDataURL(file);
}
</script>

</body>
</html>
