<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #fff7f0;
  margin: 0;
  padding: 0;
}

header {
  width: 100%;
  margin: 0;
  padding: 0;
}

.testeira {
  width: 100%;
  display: block;
}

.header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: auto;
    }

main {
  max-width: 1100px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0px 0px 12px rgba(0,0,0,0.2);
}

.section-title {
  background: #ff7a00;
  color: white;
  padding: 12px;
  border-radius: 10px;
  margin-top: 40px;
  font-size: 18px;
}

.category-box {
  border: 2px solid #ffd2a8;
  padding: 15px;
  border-radius: 12px;
  margin-top: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  border: 1px solid #ddd;
  padding: 8px;
  font-size: 14px;
  text-align: center;
}

th {
  background: #ffe0c2;
}

input, select {
  width: 95%;
  padding: 6px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

.btn-add {
  margin-top: 10px;
  background: #ff7a00;
  border: none;
  padding: 7px 14px;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

.btn-remove {
  background: red;
  color: white;
  border: none;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
}

.botoes-final {
  display: flex;
  gap: 15px;
  margin-top: 50px;
}

.btn-submit {
  width: 50%;
  padding: 14px;
  background: #ff7a00;
  color: white;
  border: none;
  font-size: 18px;
  border-radius: 12px;
  cursor: pointer;
}

.btn-voltar {
  background: #cc5f00;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
}

footer {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
  color: gray;
}

.mensagem-erro {
  background: #ffe6e6;
  color: #b30000;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 15px;
  font-weight: bold;
}

.btn-erro {
  background: #cc0000 !important;
}

</style>
</head>

<body>

<header>
  <div class="header-top">
    <!-- ✅ TESTEIRA IMAGEM -->
  <img class="testeira"
       src="https://raw.githubusercontent.com/CCN1989/Imagens/refs/heads/main/testeira%20ficha%20GRP.png"

    </div>
</header>

  </div>

    <img src="https://github.com/CCN1989/Imagens/blob/main/12RT.png?raw=true">
  </div>
</header>

<form id="formInscricao">
<main>

<div class="section-title">Dados da Entidade</div>

<div class="category-box">
<table>
<tr>

<td>Município *</td><td><input id="municipio" required></td>
</tr>
<tr>
<td>RT *</td>
<td>
  <select id="rt" required>
    <option value="">Selecione a RT</option>
    <option>1ª RT</option>
    <option>2ª RT</option>
    <option>3ª RT</option>
    <option>4ª RT</option>
    <option>5ª RT</option>
    <option>6ª RT</option>
    <option>7ª RT</option>
    <option>8ª RT</option>
    <option>9ª RT</option>
    <option>10ª RT</option>
    <option>11ª RT</option>
    <option>12ª RT</option>
    <option>13ª RT</option>
    <option>14ª RT</option>
    <option>15ª RT</option>
    <option>16ª RT</option>
    <option>17ª RT</option>
    <option>18ª RT</option>
    <option>19ª RT</option>
    <option>20ª RT</option>
    <option>21ª RT</option>
    <option>22ª RT</option>
    <option>23ª RT</option>
    <option>24ª RT</option>
    <option>25ª RT</option>
    <option>26ª RT</option>
    <option>27ª RT</option>
    <option>28ª RT</option>
    <option>29ª RT</option>
    <option>30ª RT</option>
  </select>
</td>
<td>Email *</td><td><input id="email" required></td>
</tr>
<tr>
<td>Patrão</td><td><input id="patrao"></td>
<td>WhatsApp *</td><td><input id="whats" required></td>
</tr>
<tr>
<td>Responsável Inscrição *</td>
<td colspan="3"><input id="responsavel" required></td>
</tr>
</table>
</div>



<div class="section-title">Categorias</div>
<div id="categorias"></div>

<div class="botoes-final">
<button type="button" class="btn-submit" id="btnEnviar" onclick="enviar()">
Enviar Inscrição
</button>
<div id="mensagemErro"></div>

<a class="btn-submit btn-voltar"
href="https://www.ctgchamanativa.com.br">
Voltar ao site
</a>
</div>

</main>

<footer>
Sistema de inscrição - CTG Chama Nativa © 2026
</footer>

<script>
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwNLzjShuHC2WjDVCiI246u7xF3udRHCL3uNEW-vKXNDJGdPNZ_PiwE910qNFdiQI-r/exec"; 
const categorias = ["Pré-Mirim", "Mirim", "Juvenil", "Adulta", "Veterana", "Xirú"];
const LIMITE = 25;

const container = document.getElementById("categorias");

categorias.forEach(nome => {
  const wrapper = document.createElement("div");
  wrapper.className = "category-box";

  wrapper.innerHTML = `
    <button type="button" class="accordion-btn" id="btn-${nome}"
      onclick="toggleCategoria('${nome}')">
      + ${nome}
    </button>
    <div id="conteudo-${nome}" class="accordion-content"></div>
  `;

  container.appendChild(wrapper);
});

function toggleCategoria(nome) {
  const content = document.getElementById(`conteudo-${nome}`);
  const btn = document.getElementById(`btn-${nome}`);

  if (content.style.maxHeight) {
    content.style.maxHeight = null;
    content.innerHTML = "";
    btn.innerHTML = `+ ${nome}`;
  } else {
    abrirCategoria(nome);
    content.style.maxHeight = content.scrollHeight + "px";
    btn.innerHTML = `− Fechar ${nome}`;
  }
}

function abrirCategoria(nome) {
  const div = document.getElementById(`conteudo-${nome}`);

  div.innerHTML = `
    <table>
      <tr>
        <td>Dança 1 *</td><td><input required></td>
        <td>Dança 2 *</td><td><input required></td>
      </tr>
      <tr>
        <td>Dança 3 *</td><td><input required></td>
        <td>Musical *</td>
        <td>
          <select required>
            <option value="">Selecione</option>
            <option>Sim</option>
            <option>Não</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>Comprovante PIX *</td>
        <td colspan="3"><input type="file" required></td>
      </tr>
    </table>

    <div class="contador">
      Integrantes: <span id="contador-${nome}">0</span> / ${LIMITE}
    </div>

    <table>
      <thead>
        <tr>
          <th>Integrante *</th>
          <th>Nascimento *</th>
          <th>Cartão *</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="${nome}-body"></tbody>
    </table>

    <button type="button" class="btn-add" onclick="addIntegrante('${nome}')">
      + Adicionar Integrante
    </button>
  `;

  atualizarAltura(nome);
}

function addIntegrante(cat) {
  const tbody = document.getElementById(`${cat}-body`);

  if (tbody.rows.length >= LIMITE) {
    alert("Limite máximo: 25 integrantes.");
    return;
  }

  const row = document.createElement("tr");

  row.innerHTML = `
    <td><input required></td>
    <td><input type="date" required></td>
    <td><input required></td>
    <td><button type="button" class="btn-remove" onclick="removeRow(this, '${cat}')">X</button></td>
  `;

  tbody.appendChild(row);
  atualizarContador(cat);
  atualizarAltura(cat);
}

function removeRow(btn, cat) {
  btn.closest("tr").remove();
  atualizarContador(cat);
  atualizarAltura(cat);
}

function atualizarContador(cat) {
  const total = document.getElementById(`${cat}-body`).rows.length;
  document.getElementById(`contador-${cat}`).innerText = total;
}

function atualizarAltura(nome) {
  const content = document.getElementById(`conteudo-${nome}`);
  content.style.maxHeight = content.scrollHeight + "px";
}

async function enviar() {

  const form = document.getElementById("formInscricao");
  const mensagemDiv = document.getElementById("mensagemErro");
  mensagemDiv.innerHTML = "";

  if (!form.checkValidity()) {
    form.reportValidity();
    return;
  }

  let categoriaAberta = false;
  let erro = false;
  let categoriasEnviar = [];

  for (let nome of categorias) {

    const content = document.getElementById(`conteudo-${nome}`);
    const btn = document.getElementById(`btn-${nome}`);

    if (content && content.style.maxHeight) {

      categoriaAberta = true;

      const inputs = content.querySelectorAll("input, select");
      const tbody = document.getElementById(`${nome}-body`);

      if (tbody.rows.length === 0) {
        erro = true;
        mensagemDiv.innerHTML = `
          <div class="mensagem-erro">
            A categoria <strong>${nome}</strong> precisa ter pelo menos 5 pares.
          </div>`;
        btn.classList.add("btn-erro");
      }

      inputs.forEach(campo => {
        if (!campo.checkValidity()) {
          erro = true;
          btn.classList.add("btn-erro");
        }
      });

      if (erro) return;

      // 🔹 Coletar dados da categoria
      const tabelaInputs = content.querySelectorAll("table input, table select");

      const danca1 = tabelaInputs[0].value;
      const danca2 = tabelaInputs[1].value;
      const danca3 = tabelaInputs[2].value;
      const musical = tabelaInputs[3].value;
      const arquivo = tabelaInputs[4].files[0];

      let integrantes = [];

      Array.from(tbody.rows).forEach(row => {
        integrantes.push({
          nome: row.cells[0].querySelector("input").value,
          nascimento: row.cells[1].querySelector("input").value,
          cartao: row.cells[2].querySelector("input").value
        });
      });

      categoriasEnviar.push({
        nome,
        danca1,
        danca2,
        danca3,
        musical,
        integrantes,
        arquivo
      });
    }
  }

  if (!categoriaAberta) {
    mensagemDiv.innerHTML = `
      <div class="mensagem-erro">
        Você deve abrir e preencher pelo menos uma categoria.
      </div>`;
    return;
  }

  if (erro) return;

  // 🔹 Converter arquivo para base64
  const arquivoBase64 = await new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.readAsDataURL(categoriasEnviar[0].arquivo);
  });

  const dados = {
    entidade: document.getElementById("entidade").value,
    municipio: document.getElementById("municipio").value,
    rt: document.getElementById("rt").value,
    email: document.getElementById("email").value,
    patrao: document.getElementById("patrao").value,
    whats: document.getElementById("whats").value,
    responsavel: document.getElementById("responsavel").value,
    categorias: categoriasEnviar.map(cat => ({
      nome: cat.nome,
      danca1: cat.danca1,
      danca2: cat.danca2,
      danca3: cat.danca3,
      musical: cat.musical,
      integrantes: cat.integrantes
    })),
    arquivo: {
      nome: categoriasEnviar[0].arquivo.name,
      tipo: categoriasEnviar[0].arquivo.type,
      base64: arquivoBase64
    }
  };

  document.getElementById("btnEnviar").disabled = true;
  document.getElementById("btnEnviar").innerText = "Enviando...";

 try {

  const response = await fetch(URL_SCRIPT, {
    method: "POST",
    body: JSON.stringify(dados)
  });

  const texto = await response.text();
  console.log("Resposta do servidor:", texto);

  if (texto !== "OK") {
    throw new Error("Resposta inesperada do servidor");
  }

  alert("Inscrição enviada com sucesso!");

} catch (erro) {
  console.error("Erro real:", erro);
  alert("Erro de conexão com o servidor.");
}

  document.getElementById("btnEnviar").disabled = false;
  document.getElementById("btnEnviar").innerText = "Enviar Inscrição";
}

</script>

</form>

left:0;
width:100%;

background:rgba(0,0,0,0.5);

      ">
      OK
    </button>
  </div>
</div>
</form>
</body>
</html>
